services:
  - type: web
    name: sports-analytics
    env: python
    # build.sh installs the backend, builds the frontend, then trims everything
    # the running site doesn't need so the upload stays small. Keep the
    # dashboard's Build Command set to the same thing.
    buildCommand: "bash build.sh"
    startCommand: "cd backend && gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite:///./sports_analytics.db
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Admin API (app/routers/admin.py). generateValue -- same treatment as
      # SECRET_KEY above -- so there's a real secret from the first deploy
      # instead of the routes sitting open until someone remembers to set one.
      # Same Odds API key the props workflow uses (GitHub secret ODDS_API_KEY).
      # Powers the "Bet this" live price check; ~1 credit per tap, cached 3 min.
      - key: ODDS_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      # Outbound email (app/notifications.py) -- new-user ping + the admin
      # API's /test-email route. All optional: leave unset (or leave
      # ADMIN_NOTIFY_EMAIL blank) to keep notifications off. See
      # backend/.env.example for the Gmail App Password setup this defaults to.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
