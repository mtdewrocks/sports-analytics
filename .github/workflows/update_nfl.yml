name: Update NFL

on:
  schedule:
    # 9:07 AM Central during daylight saving time (UTC-5) = 14:07 UTC.
    # Offset off the top of the hour on purpose -- see update_statcast.yml's
    # comment on this; :00 schedules are the most likely to be delayed.
    - cron: "7 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-nfl
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Re-pulls and re-aggregates the whole season's play-by-play each run
      # -- nflverse republishes the full file, not an incremental daily log,
      # so there's no bootstrap/incremental split needed here (unlike the
      # MLB bullpen script). A no-op on days with no new games; harmless.
      #
      # continue-on-error: a step failing here shouldn't also throw away the
      # OTHER script's output -- GitHub Actions skips every later step in a
      # job by default once one fails, which silently zeroed out this whole
      # run (including the team-stats step, which would have succeeded
      # fine) the first time this file didn't exist yet for a new season.
      - name: Update NFL play-by-play usage
        id: pbp
        continue-on-error: true
        run: python -u backend/app/get_nfl_pbp.py

      # Team offense/defense stats + ranks, for the Matchup page.
      - name: Update NFL team stats
        id: team_stats
        continue-on-error: true
        run: python -u backend/app/get_nfl_weekly_stats.py

      # Week-by-week defensive rank history, for context on the Game Log
      # page (what a defense was ranked entering the week a game was
      # actually played, not its current rank).
      - name: Update NFL weekly defense ranks
        id: weekly_defense_ranks
        continue-on-error: true
        run: python -u backend/app/get_nfl_weekly_defense_ranks.py

      - name: Commit updated data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/nfl/player_week_usage.parquet backend/data/nfl/team_stats.parquet backend/data/nfl/weekly_defense_ranks.parquet

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update NFL play-by-play usage, team stats, and weekly defense ranks"
            git pull --rebase
            git push
          fi

      # Only fail the whole run if ALL THREE pulls failed -- any one alone
      # succeeding still commits real data and shouldn't page you.
      - name: Fail if all pulls failed
        if: steps.pbp.outcome == 'failure' && steps.team_stats.outcome == 'failure' && steps.weekly_defense_ranks.outcome == 'failure'
        run: |
          echo "All three NFL data pulls failed this run -- check the logs above."
          exit 1
