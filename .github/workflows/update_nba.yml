name: Update NBA

on:
  schedule:
    # 10:47 AM Central (CDT, UTC-5) = 15:47 UTC. hoopR republishes the
    # current season's box scores overnight, so last night's games are in by
    # mid-morning. The 4:47 PM run picks up anything late and refreshes
    # tonight's schedule/tip times before games start. Off the top of the
    # hour on purpose (see update_statcast.yml).
    - cron: "47 15 * * *"
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      refresh_prior:
        description: "Re-download last season too (normally cached after the first run)"
        type: boolean
        default: false
      backfill_odds:
        description: "Also buy past pregame spreads/totals from The Odds API (one-off, ~20 credits per game day, ~3,700 total)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-nba
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install "pandas>=2.2,<3" numpy pyarrow requests "lightgbm>=4.5,<5"

      # Restore last season's cached raw file (nba_box_raw_<year>.parquet) so
      # it's only downloaded once, plus the previous schedule in case today's
      # ESPN calls fail. Injury files in this release are left alone.
      - name: Restore data from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release_data.sh pull data-nba backend/data/nba 'nba_box_raw_*.parquet'
          bash scripts/release_data.sh pull data-nba backend/data/nba 'nba_schedule.parquet'
          bash scripts/release_data.sh pull data-nba backend/data/nba 'nba_game_odds.parquet'
          # For projections: the injury report (written every 15 min by
          # update_injuries.yml) and the running projection log
          bash scripts/release_data.sh pull data-nba backend/data/nba 'nba_injuries.parquet'
          bash scripts/release_data.sh pull data-nba backend/data/nba 'nba_projection_log.parquet'
          bash scripts/release_data.sh pull data-nba backend/data/nba 'nba_projection_plays.parquet'
          bash scripts/release_data.sh pull data-nba backend/data/nba 'NBA_Props.parquet'

      - name: Update NBA data
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.refresh_prior }}" = "true" ]; then ARGS="--refresh-prior"; fi
          python -u backend/app/get_nba_data.py $ARGS

      # Shawn's stat model, automated: retrain on last night's box scores,
      # build tonight's slate with default minutes and the injury report,
      # publish features so the site can rerun it with edited minutes.
      # ~20 s. See get_nba_projections.py.
      - name: Backfill past game lines (The Odds API)
        if: github.event.inputs.backfill_odds == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -u backend/app/get_nba_odds_history.py --start 2025-10-21 --max-credits 5000

      - name: Project player stats
        # A projection failure shouldn't stop last night's box scores from publishing
        continue-on-error: true
        run: python -u backend/app/get_nba_projections.py

      - name: Publish data to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          D=backend/data/nba
          bash scripts/release_data.sh push data-nba \
            $D/nba_player_stats.parquet \
            $D/nba_schedule.parquet \
            $D/nba_game_odds.parquet \
            $D/nba_meta.json \
            $D/nba_box_raw_*.parquet \
            $D/nba_projection_model.json \
            $D/nba_projection_slate.parquet \
            $D/nba_projection_log.parquet \
            $D/nba_projection_plays.parquet
