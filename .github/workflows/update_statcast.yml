name: Update Statcast

on:
  schedule:
    # Hourly, 9:00 AM - 9:00 PM Central during daylight saving time (UTC-5).
    # GitHub Actions cron is UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-statcast
  cancel-in-progress: false

env:
  # Python block-buffers stdout when it is not attached to a TTY, so without
  # this the per-chunk progress lines never reach the Actions log and a long
  # Statcast pull looks frozen.
  PYTHONUNBUFFERED: "1"

jobs:
  update-statcast:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow openpyxl pybaseball

      - name: Run Statcast update
        run: python -u backend/app/update_stats_refactored.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only this script's outputs -- backend/data/mlb also holds
          # files written by other jobs. The -f test skips anything the run did
          # not produce; a bare `git add` on a missing path exits 128 and kills
          # the step even when the rest of the run succeeded.
          for f in daily_components_2026.parquet \
                   fg_woba_weights.json \
                   statcast_hitters_2026.xlsx \
                   statcast_pitchers_2026.xlsx; do
            if [ -f "backend/data/mlb/$f" ]; then
              git add "backend/data/mlb/$f"
            else
              echo "missing (skipped): $f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Statcast data"
            git pull --rebase --autostash
            git push
          fi
