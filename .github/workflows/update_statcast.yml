name: Update Statcast

on:
  schedule:
    # Hourly, 9:00 AM - 9:00 PM Central during daylight saving time (UTC-5).
    # GitHub Actions cron is UTC.
    - cron: "0 14-23 * * *"   # 9 AM - 6 PM CDT
    - cron: "0 0-2 * * *"     # 7 PM - 9 PM CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-statcast
  cancel-in-progress: false

jobs:
  update-statcast:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow openpyxl pybaseball

      - name: Run Statcast update
        run: python backend/app/update_stats_refactored.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add backend/data/mlb/daily_components_2026.parquet
          git add backend/data/fg_woba_weights.json
          git add backend/data/mlb/statcast_hitters_2026.xlsx
          git add backend/data/mlb/statcast_pitchers_2026.xlsx

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Statcast data"
            git pull --rebase --autostash
            git push
          fi
