name: Update Statcast

on:
  schedule:
    # 8:00 AM Central during daylight saving time (UTC-5) = 13:00 UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-statcast
  cancel-in-progress: false

env:
  # Python block-buffers stdout when it is not attached to a TTY, so without
  # this the per-chunk progress lines never reach the Actions log and a long
  # Statcast pull looks frozen.
  PYTHONUNBUFFERED: "1"

jobs:
  update-statcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow openpyxl pybaseball

      - name: Run Statcast update
        run: python -u backend/app/update_stats_refactored.py

      # Both must follow the Statcast update -- they read the daily_components
      # file that step just rewrote.
      - name: Build hot hitters
        run: python -u backend/app/build_hot_hitters.py

      - name: Build pitcher splits
        run: python -u backend/app/build_splits.py

      # Refetches only pitchers who actually started yesterday -- that set is
      # fixed by morning, so this belongs on the daily run rather than the
      # hourly one. First run with no existing file does a full pull.
      - name: Update pitcher game logs
        run: python -u backend/app/get_pitcher_logs.py

      # Same idea, but for every pitcher who appeared (starters + relievers).
      # Powers the Bullpen page's workload/freshness view.
      - name: Update bullpen logs
        run: python -u backend/app/get_bullpen_logs.py

      # Season ERA/WHIP/K%/BB% for every pitcher, SP and RP alike --
      # starters.parquet drops anyone with 0 games started, which is fine
      # for the dropdown but leaves true relievers with no season rate
      # stats anywhere. This keeps everyone.
      - name: Update season pitching stats
        run: python -u backend/app/get_season_pitching_stats.py

      - name: Download Savant percentiles
        run: python -u backend/app/get_percentiles.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage only this workflow's outputs -- backend/data/mlb also holds
          # files written by the hourly job. The -f test skips anything a run
          # did not produce; a bare `git add` on a missing path exits 128 and
          # kills the step even when everything else succeeded.
          for f in daily_components_2026.parquet \
                   fg_woba_weights.json \
                   statcast_hitters_2026.xlsx \
                   statcast_pitchers_2026.xlsx \
                   hot_hitters.parquet \
                   pitcher_splits.parquet \
                   pitcher_logs.parquet \
                   bullpen_logs.parquet \
                   season_pitching_stats.parquet \
                   pitcher_percentiles.parquet \
                   hitter_percentiles.parquet; do
            if [ -f "backend/data/mlb/$f" ]; then
              git add "backend/data/mlb/$f"
            else
              echo "missing (skipped): $f"
            fi
          done

          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Update Statcast data, hot hitters, logs and percentiles"
            git pull --rebase --autostash
            git push
          fi
