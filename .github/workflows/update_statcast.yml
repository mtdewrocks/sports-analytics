name: Update Statcast

on:
  schedule:
    # ~8 AM Central during daylight saving time (UTC-5) = 13:xx UTC.
    #
    # Two slots rather than one, at unpopular minutes. GitHub's scheduler drops
    # and delays `schedule` events under load, and :00 is the single most
    # contended minute on the platform -- a daily job that gets dropped is a
    # whole day without fresh Statcast rather than an hour. The second slot is
    # the retry; the job is idempotent, so a second run just re-uploads the
    # same assets over themselves.
    - cron: "9 11 * * *"
    - cron: "38 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-statcast
  cancel-in-progress: false

env:
  # Python block-buffers stdout when it is not attached to a TTY, so without
  # this the per-chunk progress lines never reach the Actions log and a long
  # Statcast pull looks frozen.
  PYTHONUNBUFFERED: "1"

jobs:
  update-statcast:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 1. The full history was only needed to commit and
      # rebase; this job publishes to a release now.
      - name: Check out repository
        uses: actions/checkout@v5

      # Whole tag, not just this job's outputs -- update_stats_refactored.py
      # and get_pitcher_logs.py both append to existing files rather than
      # refetching the season, and the release is now the only copy of that
      # state.
      - name: Restore data from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release_data.sh pull data-mlb backend/data/mlb

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow openpyxl pybaseball

      - name: Run Statcast update
        run: python -u backend/app/update_stats_refactored.py

      # Both must follow the Statcast update -- they read the daily_components
      # file that step just rewrote.
      - name: Build hot hitters
        run: python -u backend/app/build_hot_hitters.py

      - name: Build pitcher splits
        run: python -u backend/app/build_splits.py

      # Team-level hitting wOBA vs LHP/RHP, season-pooled and last 30 days
      # -- feeds the Team Matchup page's early-available hitting context.
      - name: Build team hitting splits
        run: python -u backend/app/build_team_hitting_splits.py

      # Refetches only pitchers who actually started yesterday -- that set is
      # fixed by morning, so this belongs on the daily run rather than the
      # hourly one. First run with no existing file does a full pull.
      - name: Update pitcher game logs
        run: python -u backend/app/get_pitcher_logs.py

      # Same idea, but for every batter who appeared (a lineup is nine deep,
      # not one "starter") -- MLB Stats API box-score stats, so runs/RBIs/
      # stolen bases/total bases come back directly instead of needing a
      # Statcast-event derivation. Powers the Hit Rate Sheet's batter markets.
      - name: Update batter game logs
        run: python -u backend/app/get_batter_logs.py

      # Same idea, but for every pitcher who appeared (starters + relievers).
      # Powers the Bullpen page's workload/freshness view.
      - name: Update bullpen logs
        run: python -u backend/app/get_bullpen_logs.py

      # Season ERA/WHIP/K%/BB% for every pitcher, SP and RP alike --
      # starters.parquet drops anyone with 0 games started, which is fine
      # for the dropdown but leaves true relievers with no season rate
      # stats anywhere. This keeps everyone.
      - name: Update season pitching stats
        run: python -u backend/app/get_season_pitching_stats.py

      - name: Download Savant percentiles
        run: python -u backend/app/get_percentiles.py

      # Replaces commit-and-push. Assets are addressed by name, so this job
      # and the hourly lineups job can write the same tag concurrently without
      # colliding -- which is what push_with_retry and the -X theirs rebase
      # existed to survive.
      - name: Publish data to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release_data.sh push data-mlb \
            backend/data/mlb/daily_components_2026.parquet \
            backend/data/mlb/fg_woba_weights.json \
            backend/data/mlb/statcast_hitters_2026.xlsx \
            backend/data/mlb/statcast_pitchers_2026.xlsx \
            backend/data/mlb/hot_hitters.parquet \
            backend/data/mlb/pitcher_splits.parquet \
            backend/data/mlb/team_hitting_splits.parquet \
            backend/data/mlb/pitcher_logs.parquet \
            backend/data/mlb/batter_logs.parquet \
            backend/data/mlb/bullpen_logs.parquet \
            backend/data/mlb/season_pitching_stats.parquet \
            backend/data/mlb/pitcher_percentiles.parquet \
            backend/data/mlb/hitter_percentiles.parquet
