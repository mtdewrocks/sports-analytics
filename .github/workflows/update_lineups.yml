name: Update Lineups

on:
  schedule:
    # Hourly, 10:00 AM - 9:00 PM Central during daylight saving time (UTC-5).
    # GitHub Actions cron is UTC, and the window crosses midnight UTC, so it
    # takes two entries.
    - cron: "0 15-23 * * *"   # 10 AM - 6 PM CDT
    - cron: "0 0-2 * * *"     # 7 PM - 9 PM CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lineups
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      # Independent of lineups -- writes starters.parquet on every run, so a
      # pitcher making his season debut reaches the dropdown within the hour.
      - name: Pull season starters
        run: python -u backend/app/get_starters.py

      # Fresh active-roster snapshot for all 30 teams, refreshed on every
      # run -- the player -> team lookup used by the Hot Hitters page. Not
      # dependent on a player having appeared in a recent game, so a trade
      # or call-up is correct within the hour instead of waiting for (or
      # permanently missing, as the old game-log-based lookup did).
      - name: Pull current MLB rosters
        run: python -u backend/app/get_mlb_rosters.py

      # Only fetches photos that are missing, so this is a no-op on a normal
      # run and costs nothing.
      - name: Download missing pitcher photos
        run: python -u backend/app/get_pitcher_images.py

      - name: Pull lineups
        run: python -u backend/app/get_lineups_chatgpt.py

      # Steps run in order and the job halts on the first failure. Early in the
      # day no lineup exists yet, so this exits without writing -- the commit
      # step skips the missing files and the run still goes green.
      - name: Build matchup table
        run: python -u backend/app/build_matchups.py

      - name: Commit data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The lineup CSV is date-stamped (kept as history); the other two are
          # fixed filenames the dashboard reads, overwritten each run.
          day="$(TZ=America/Chicago date +%F)"

          for path in "backend/data/mlb/starters.parquet" \
                      "backend/data/mlb/mlb_rosters.parquet" \
                      "backend/data/mlb/lineups_${day}.csv" \
                      "backend/data/mlb/daily_matchups.parquet"; do
            if [ -f "$path" ]; then
              git add "$path"
            else
              echo "missing (skipped): $path"
            fi
          done

          # A directory rather than a filename: which photos appeared is not
          # known ahead of time. Unlike a missing file, `git add` on a
          # directory with no changes is harmless.
          git add backend/data/mlb/pitcher_images

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update starters, lineups and matchups"
            git pull --rebase --autostash
            git push
          fi
