name: Update Lineups

on:
  schedule:
    # Hourly, 10:00 AM - 9:00 PM Central during daylight saving time (UTC-5).
    # GitHub Actions cron is UTC, and the window crosses midnight UTC, so it
    # takes two entries.
    - cron: "0 15-23 * * *"   # 10 AM - 6 PM CDT
    - cron: "0 0-2 * * *"     # 7 PM - 9 PM CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lineups
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      - name: Pull starters and lineups
        run: python -u backend/app/get_lineups_chatgpt.py

      # Steps run in order and the job stops on the first failure, so this only
      # runs once the lineup pull has succeeded and written its CSV.
      - name: Build matchup table
        run: python -u backend/app/build_matchups.py

      - name: Commit lineups and matchups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The lineup CSV is date-stamped (kept as history); the matchup table
          # is a fixed filename the dashboard reads, overwritten each run.
          day="$(TZ=America/Chicago date +%F)"

          for path in "backend/data/mlb/lineups_${day}.csv" \
                      "backend/data/mlb/daily_matchups.parquet"; do
            if [ -f "$path" ]; then
              git add "$path"
            else
              echo "missing (skipped): $path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update lineups and matchups"
            git pull --rebase --autostash
            git push
          fi
