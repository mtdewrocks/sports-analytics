name: Update Lineups

on:
  schedule:
    # Every 30 minutes, 10:07 AM - 9:07 PM Central during daylight saving time
    # (UTC-5). GitHub Actions cron is UTC, and the window crosses midnight UTC,
    # so it takes several entries. During standard time (UTC-6, Nov-Mar) the
    # same UTC entries land an hour earlier: 9:07 AM - 8:07 PM Central.
    #
    # WHY THREE SLOTS AN HOUR FOR AN HOURLY JOB
    # -----------------------------------------
    # GitHub's scheduler is best-effort, and on a free public repo it is
    # markedly so: `schedule` events are delivered late under load, and a
    # backlog gets coalesced rather than replayed. Asking for hourly here
    # produced roughly one run every two and a half to three hours, with start
    # times wandering as much as two hours past the requested minute -- one run
    # requested at 9:12 PM Central actually landed at 11:47 PM.
    #
    # So this asks for more than it needs and lets the drops bring it back down
    # to about hourly. That is only safe because the job is idempotent: it
    # re-pulls the same endpoints and re-uploads the same release assets over
    # themselves. A run that finds nothing new costs ~40s of free-tier compute.
    #
    # If you ever need an actual guarantee rather than a good average, the only
    # way is to stop using GitHub's scheduler: have something with a real clock
    # (a Render cron job -- you already run there) POST to the workflow_dispatch
    # API on a schedule you control.
    #
    # Minutes are deliberately off the quarter-hour: :00, :15, :30 and :45 are
    # where everyone else's crons pile up, and contention is what the scheduler
    # sheds load against.
    #
    # NOTE: once the `dispatch-lineups` Render cron in render.yaml is live, it
    # drives this workflow every 20 minutes through the workflow_dispatch API
    # and these entries become a BACKSTOP for the case where Render is the
    # thing that's down. At that point thin them out to something sparse --
    # "7 14,19,1 * * *" is three times a day and plenty -- so you aren't
    # running 42 redundant jobs. Leave them as-is until the Render side has
    # proven itself for a day or two.
    - cron: "7,37 15-23 * * *"   # 10:07 AM - 6:37 PM CDT
    - cron: "7,37 0-1 * * *"     # 7:07 PM - 8:37 PM CDT
    - cron: "7 2 * * *"          # 9:07 PM CDT
  workflow_dispatch:

permissions:
  contents: write

# cancel-in-progress: TRUE, deliberately.
#
# With `false`, GitHub keeps at most one pending run per group and cancels any
# others that arrive behind it -- which turns the scheduler's delivery backlog
# into silently dropped runs. That is the opposite of what's wanted here: when
# two triggers land close together the fresher data wins, and there is nothing
# in a half-finished run worth protecting. The reason the group existed in the
# first place -- two jobs racing to push the same .parquet into one branch --
# no longer exists at all now that data goes to a release, where assets are
# addressed by name and cannot collide.
concurrency:
  group: update-lineups
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # fetch-depth: 1 now. The old value of 0 pulled the ENTIRE history on
      # every run, which was only needed because this job used to commit and
      # rebase. It publishes to a release instead, so it needs the code and
      # nothing else -- and the history it was cloning was 121 MB and growing.
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pyarrow

      # Pulls the WHOLE tag, not just this job's own outputs, and deliberately
      # so. Two reasons:
      #
      #   1. Several builders here append to what is already on disk rather
      #      than rebuilding (get_bullpen_logs.py, get_pitcher_logs.py). Once
      #      the files leave git the release is the only copy of that state.
      #   2. This job reads files the STATCAST job writes -- build_matchups.py
      #      needs daily_components_2026.parquet and get_lineups_chatgpt.py
      #      needs statcast_hitters_2026.xlsx. Filtering to *.parquet here
      #      would have broken the lineup pull on the xlsx, quietly, a day
      #      after the cutover.
      #
      # ~20 MB, and still cheaper than the full-history clone this replaced.
      - name: Restore data from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/release_data.sh pull data-mlb backend/data/mlb

      # Independent of lineups -- writes starters.parquet on every run, so a
      # pitcher making his season debut reaches the dropdown within the hour.
      - name: Pull season starters
        run: python -u backend/app/get_starters.py

      # Fresh active-roster snapshot for all 30 teams, refreshed on every
      # run -- the player -> team lookup used by the Hot Hitters page. Not
      # dependent on a player having appeared in a recent game, so a trade
      # or call-up is correct within the hour instead of waiting for (or
      # permanently missing, as the old game-log-based lookup did).
      - name: Pull current MLB rosters
        run: python -u backend/app/get_mlb_rosters.py

      # Today's probable starters, independent of whether lineups have
      # posted -- feeds the Pitcher Daily Report's pitcher list, which
      # should show every starter right away rather than waiting on
      # lineups. get_lineups_chatgpt.py below already fetches this exact
      # info internally, but only keeps it attached to a batter row, so it
      # gets silently discarded on every early-day run before lineups post.
      - name: Pull probable starters
        id: probable_starters
        continue-on-error: true
        run: python -u backend/app/get_probable_starters.py

      # Full-season completed game scores -- team records, recent form,
      # and head-to-head for the MLB Matchup page, all from one pull.
      - name: Pull schedule results
        id: schedule_results
        continue-on-error: true
        run: python -u backend/app/get_mlb_schedule_results.py

      # Only fetches photos that are missing, so this is a no-op on a normal
      # run and costs nothing.
      - name: Download missing pitcher photos
        run: python -u backend/app/get_pitcher_images.py

      - name: Pull lineups
        run: python -u backend/app/get_lineups_chatgpt.py

      # Steps run in order and the job halts on the first failure. Early in the
      # day no lineup exists yet, so this exits without writing -- the publish
      # step skips the missing files and the run still goes green.
      - name: Build matchup table
        run: python -u backend/app/build_matchups.py

      # Replaces the old commit-and-push step entirely.
      #
      # Gone with it: git config, the date-stamped `git add` loop, the
      # `-X theirs` rebase and push_with_retry. All of that existed to survive
      # two jobs racing to write the same .parquet into one branch. Assets are
      # addressed by name, so two workflows writing different files under the
      # same tag simply do not collide, and there is nothing to retry.
      #
      # The date-stamped lineup CSV still accumulates one asset per day as
      # history; that is fine, since assets do not count toward repo size.
      - name: Publish data to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          day="$(TZ=America/Chicago date +%F)"
          bash scripts/release_data.sh push data-mlb \
            backend/data/mlb/starters.parquet \
            backend/data/mlb/mlb_rosters.parquet \
            backend/data/mlb/probable_starters.parquet \
            backend/data/mlb/schedule_results.parquet \
            "backend/data/mlb/lineups_${day}.csv" \
            backend/data/mlb/daily_matchups.parquet

      # Pitcher headshots stay in git on purpose. They are written once per
      # pitcher and never rewritten, so they cause no history churn -- and the
      # frontend links to them by raw URL (MLBMatchup.tsx IMAGE_BASE), which a
      # flat release asset namespace could not serve as a directory.
      - name: Commit new pitcher images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/data/mlb/pitcher_images
          if git diff --cached --quiet; then
            echo "No new images."
          else
            git commit -m "Add pitcher images"
            git push || { git pull --rebase --autostash && git push; }
          fi
