name: Update Lineups

on:
  schedule:
    # Hourly, 10:00 AM - 9:00 PM Central during daylight saving time (UTC-5).
    # GitHub Actions cron is UTC, and the window crosses midnight UTC, so it
    # takes two entries.
    - cron: "0 15-23 * * *"   # 10 AM - 6 PM CDT
    - cron: "0 0-2 * * *"     # 7 PM - 9 PM CDT
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lineups
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  update-lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Pull starters and lineups
        run: python -u backend/app/get_lineups_chatgpt.py

      - name: Commit lineups
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # get_lineups.py names its output for the Central-time date, so build
          # the same filename here rather than globbing.
          dest="backend/data/mlb/lineups_$(TZ=America/Chicago date +%F).csv"

          if [ -f "$dest" ]; then
            git add "$dest"
          else
            echo "no lineup file written (no games, or none posted yet)"
          fi

          if git diff --cached --quiet; then
            echo "No lineup changes to commit."
          else
            git commit -m "Update lineups"
            git pull --rebase --autostash
            git push
          fi
